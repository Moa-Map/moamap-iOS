name: CI

on:
  pull_request:
    branches: [dev, main]

# 같은 PR 에 커밋을 연달아 올리면 이전 실행을 죽인다.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: 툴체인 확인
        run: |
          xcodebuild -version
          swift --version

      # SPM 이 Mapbox 아티팩트를 받으려면 인증이 필요하다. 없으면 401 로 멈춘다.
      - name: Mapbox 다운로드 인증
        env:
          TOKEN: ${{ secrets.MAPBOX_DOWNLOADS_TOKEN }}
        run: |
          printf 'machine api.mapbox.com\n  login mapbox\n  password %s\n' "$TOKEN" > ~/.netrc
          chmod 600 ~/.netrc

      # 시크릿은 레포에 없다. 러너에서 매번 만든다.
      - name: Secrets.xcconfig 생성
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          KAKAO_NATIVE_APP_KEY: ${{ secrets.KAKAO_NATIVE_APP_KEY }}
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          MAPBOX_PUBLIC_TOKEN: ${{ secrets.MAPBOX_PUBLIC_TOKEN }}
        run: |
          # xcconfig 는 `//` 를 주석으로 읽는다. 시크릿에는 평범한 URL 을 넣고 여기서 우회한다.
          escaped_base_url=$(printf '%s' "$BASE_URL" | sed 's|//|$(SLASH)$(SLASH)|g')
          cat > Configs/Secrets.xcconfig <<EOF
          BASE_URL = $escaped_base_url
          KAKAO_NATIVE_APP_KEY = $KAKAO_NATIVE_APP_KEY
          KAKAO_REST_API_KEY = $KAKAO_REST_API_KEY
          MAPBOX_PUBLIC_TOKEN = $MAPBOX_PUBLIC_TOKEN
          EOF

      # Mapbox 가 커서 매번 받으면 빌드 시간이 크게 늘어난다.
      - name: SPM 캐시
        uses: actions/cache@v4
        with:
          path: .spm
          key: spm-${{ runner.os }}-${{ hashFiles('MoaMap.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: 시뮬레이터 선택
        id: sim
        run: |
          name=$(xcrun simctl list devices available --json \
            | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(dev['name'] for rt in sorted(d) if 'iOS' in rt for dev in d[rt] if dev['name'].startswith('iPhone')))")
          echo "선택된 시뮬레이터: $name"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      # UI 테스트는 돌리지 않는다. 
      - name: 빌드 및 유닛 테스트
        run: |
          xcodebuild test \
            -project MoaMap.xcodeproj \
            -scheme MoaMap \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.name }}" \
            -clonedSourcePackagesDirPath .spm \
            -only-testing:MoaMapTests
